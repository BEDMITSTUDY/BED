# BED v3 Simulation Configuration (Public Version)

simulation:
  steps: 100
  seed: 42

hazard_model:
  base_rate: 0.05
  recency_weight: -0.1
  habit_weight: 0.4
  responsiveness_weight: 0.3

behavioral_state:
  habit_step: 0.05
  responsiveness_up: 0.02
  responsiveness_down: 0.01

cmdp_solver:
  budget: 100
  cost_per_action: 1
  responsiveness_threshold: 0.5
